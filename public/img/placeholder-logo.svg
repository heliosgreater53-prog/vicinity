<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="100" fill="#F0FDF4"/>
  <rect width="200" height="200" rx="100" fill="url(#lg_logo)"/>
  <!-- Subtle inner ring -->
  <circle cx="100" cy="100" r="88" stroke="#BBF7D0" stroke-width="1.5" fill="none"/>
  <!-- Store icon -->
  <g transform="translate(52, 54)">
    <!-- Roof/awning -->
    <path d="M4 32 L4 20 Q4 16 8 16 L88 16 Q92 16 92 20 L92 32" fill="#86EFAC" stroke="none"/>
    <path d="M0 36 Q0 28 4 28 L96 28 Q100 28 100 36 L100 44 Q100 52 96 52 L4 52 Q0 52 0 44 Z" fill="#4ADE80"/>
    <!-- Awning stripes -->
    <path d="M20 28 L14 52" stroke="#22C55E" stroke-width="2" opacity="0.5"/>
    <path d="M36 28 L30 52" stroke="#22C55E" stroke-width="2" opacity="0.5"/>
    <path d="M52 28 L46 52" stroke="#22C55E" stroke-width="2" opacity="0.5"/>
    <path d="M68 28 L62 52" stroke="#22C55E" stroke-width="2" opacity="0.5"/>
    <path d="M84 28 L78 52" stroke="#22C55E" stroke-width="2" opacity="0.5"/>
    <!-- Building body -->
    <rect x="8" y="52" width="84" height="44" rx="2" fill="#DCFCE7"/>
    <rect x="8" y="52" width="84" height="44" rx="2" stroke="#86EFAC" stroke-width="1.5" fill="none"/>
    <!-- Door -->
    <rect x="38" y="72" width="24" height="24" rx="3" fill="#4ADE80"/>
    <circle cx="56" cy="84" r="2" fill="#15803D"/>
    <!-- Windows -->
    <rect x="14" y="58" width="18" height="12" rx="2" fill="#BBF7D0"/>
    <rect x="68" y="58" width="18" height="12" rx="2" fill="#BBF7D0"/>
    <!-- Window cross -->
    <line x1="23" y1="58" x2="23" y2="70" stroke="#86EFAC" stroke-width="1"/>
    <line x1="14" y1="64" x2="32" y2="64" stroke="#86EFAC" stroke-width="1"/>
    <line x1="77" y1="58" x2="77" y2="70" stroke="#86EFAC" stroke-width="1"/>
    <line x1="68" y1="64" x2="86" y2="64" stroke="#86EFAC" stroke-width="1"/>
  </g>
  <defs>
    <linearGradient id="lg_logo" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
</svg>


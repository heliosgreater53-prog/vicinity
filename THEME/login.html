<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vicinity - Login</title>
    <link rel="stylesheet" href="modern.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-..."
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="login-container">
      <div class="login-container-header">
        <div class="login-logo">
          <div class="login-img">
            <i class="fa-solid fa-users"></i>
          </div>
        </div>
        <div class="login-title">Vicinity</div>
      </div>
      <div class="login-container-text">
        <p class="login-title">Welcome Back!</p>
        <p class="login-subtitle">
          Login in to continue connecting to your community
        </p>
      </div>

      <div class="login-container-form">
        <form action="index.html">
          <label for="" class="field-label">Email Or Handle</label>
          <div class="field-container">
            <i class="fa-solid fa-envelope field-icon"></i>
            <input
              type="text"
              placeholder="Enter your email or handle"
              class="field-input"
              required
            />
          </div>
          <label for="" class="field-label">Password</label>
          <div class="field-container">
            <i class="fa-solid fa-lock field-icon"></i>
            <input
              type="password"
              placeholder="Enter your password"
              class="field-input"
              required
            />
          </div>
          <div class="login-options">
            <label class="checkbox-container">
              <input type="checkbox" class="login-checkbox" />
              <span class="custom-checkbox"></span>
              Remember me
            </label>
            <a href="#" class="login-link">Forgot Password?</a>
          </div>
          <div class="login-options">
            <a href="signup.html" class="login-link">Create an account</a>
          </div>
          <button type="submit" class="login-button">Login</button>
        </form>
      </div>
    </div>
  </body>
</html>
